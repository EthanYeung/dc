version: 1

principles:
  - least_privilege
  - scoped_credentials
  - revocable_access
  - no_plaintext_secrets_in_git
  - no_secrets_in_agent_memory
  - no_secrets_in_task_descriptions
  - audit_sensitive_access

preferred_access:
  api_token: true
  short_lived_token: true
  delegated_oauth: true
  master_password: false

production:
  destructive_operations_require_elevated_approval: true
