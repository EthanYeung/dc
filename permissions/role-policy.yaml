version: 2

delegation:
  principle: "subagent authority must not exceed parent authority"
  effective_scope: "parent_role AND delegated_task AND subagent_safety_ceiling"
  consequential_actions_route_to_parent: true
  subagent_may_not:
    - spend
    - create_financial_commitment
    - modify_company_state
    - grant_approval
    - modify_constitution
    - modify_policy
    - expand_credential_scope
    - access_master_credentials
    - perform_unapproved_irreversible_action

roles:
  allocator:
    allow:
      - read_company_state
      - create_task
      - create_experiment
      - allocate_within_budget
      - stop_experiment
      - read_ledger
      - request_approval
      - spawn_bounded_subagent
    deny:
      - modify_constitution
      - expand_credential_scope
      - bypass_guard

  research:
    allow:
      - web_search
      - browser_read
      - low_risk_browser_interaction
      - analysis
      - write_evidence
      - request_task
      - spawn_bounded_subagent
    deny:
      - production_deploy
      - production_delete
      - financial_commitment

  builder:
    allow:
      - terminal
      - repository_write
      - test
      - approved_deploy
      - browser
      - computer_use
      - spawn_bounded_subagent
    deny:
      - alter_financial_limits
      - unapproved_recurring_commitment

  growth:
    allow:
      - browser
      - approved_outreach
      - approved_channel_operation
      - write_evidence
      - spend_within_experiment_budget
      - spawn_bounded_subagent
    deny:
      - credential_admin
      - production_infrastructure_admin

  auditor:
    allow:
      - read_all_operational_state
      - read_audit_log
      - read_ledger
      - write_audit_finding
      - spawn_bounded_subagent
    deny:
      - spend
      - deploy
      - grant_exception
